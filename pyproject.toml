[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "report-skill"
version = "0.4.0"
description = "External skill layer that turns Claude-organized content into ReportArchive reports using its widget/template system."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "rich>=13.7",
    "jsonschema>=4.22",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
report-skill = "report_skill.cli:app"
report-skill-mcp = "report_skill.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the bundled widget catalog + template snapshots so consumers can
# operate with just a server URL — no `catalog sync` / `templates sync`
# round-trip required for the first POST.
"report_skill" = ["data/*.json", "data/templates/*.json"]

[tool.pyright]
# Make pyright/Pylance pick up the local venv instead of system Python — fixes
# the constant "Import 'report_skill' could not be resolved" warnings.
venvPath = "."
venv = "venv"
include = ["src", "tests", "bridge"]
exclude = ["venv", ".skill-cache", "examples"]
reportMissingImports = "warning"
reportUnusedImport = "information"
